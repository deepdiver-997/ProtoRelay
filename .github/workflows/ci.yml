name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install core dependencies
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Configure without networking or logging drivers
        run: |
          cmake -B build -DPROTORELAY_BUILD_BACKEND_CONTRACTS_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_DISABLE_FIND_PACKAGE_Boost=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE
      - name: Build and verify the backend boundary
        run: |
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          if find build -name '*.o.d' -exec grep -lE '/(boost|spdlog|fmt|openssl)/' {} + | grep .; then exit 1; fi

  webmail-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix webmail
      - name: Check frontend formatting
        run: npm run --prefix webmail format:check
      - name: Typecheck and build frontend
        run: npm run --prefix webmail build

  # ---- 单元测试 (Debug 构建全部单测 + 运行 ctest) ----
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [STD, BOOST]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-dev \
                                  libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPROTORELAY_WORKER_BACKEND=${{ matrix.worker }}

      - name: Build unit tests
        # unit_tests 是 CMake 里的聚合 target，新增单测自动包含
        run: cmake --build build --target unit_tests -j$(nproc)

      - name: Run unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

  # No development headers/libraries for spdlog or fmt are installed here.
  optional-logging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        logging: [STANDARD, NONE]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies without spdlog/fmt
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libc-ares-dev libmysqlclient-dev \
            libboost-dev nlohmann-json3-dev libcurl4-openssl-dev
      - name: Configure without spdlog/fmt
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DPROTORELAY_LOG_BACKEND=${{ matrix.logging }} \
            -DPROTORELAY_WORKER_BACKEND=STD \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE
      - name: Build servers and backend contract tests
        run: |
          cmake --build build --target smtpsServer webmailServer pop3Server \
            logger_test std_thread_pool_test connection_interface_test asio_executor_test -j2
      - name: Verify contracts and linked dependencies
        run: |
          ctest --test-dir build -R '^(logger_test|std_thread_pool_test|connection_interface_test|asio_executor_test)$' --output-on-failure
          if ldd build/smtpsServer | grep -E 'lib(spdlog|fmt)'; then exit 1; fi

  # ---- 完整构建 (确认所有 target 能编译) ----
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-dev \
                                  libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j$(nproc)

  # ---- Fuzz 冒烟（MIME 解析器，30 秒有界运行，发现崩溃即红） ----
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-dev \
                                  libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure (clang + libFuzzer)
        run: |
          CC=clang CXX=clang++ cmake -B build-fuzz \
            -DENABLE_FUZZING=ON -DBUILD_TESTS=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --target mime_fuzz smtp_fuzz -j$(nproc)

      - name: Fuzz smoke (30s each)
        run: |
          ./build-fuzz/mime_fuzz test/fuzz/corpus/mime \
            -max_total_time=30 -rss_limit_mb=2560 -malloc_limit_mb=512 \
            -artifact_prefix=./crash-mime-
          ./build-fuzz/smtp_fuzz test/fuzz/corpus/smtp \
            -max_total_time=30 -rss_limit_mb=2560 -malloc_limit_mb=512 \
            -artifact_prefix=./crash-smtp-

  # ---- ASan+UBSan 单测（string_view 越界、空指针 UB 在这层暴露） ----
  asan-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-dev \
                                  libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build-asan -DENABLE_ASAN=ON

      - name: Build unit tests
        run: cmake --build build-asan --target unit_tests -j$(nproc)

      - name: Run unit tests (ASan+UBSan)
        run: ctest --test-dir build-asan --output-on-failure

  # ---- 覆盖率（gcc + lcov，HTML 报告上传为 artifact）----
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-dev \
                                  libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev lcov

      - name: Coverage (build + run + report)
        run: bash test/scripts/coverage.sh --ci

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-cov/html
